name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/TfsEd.Cli -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version="$version" -o out/${{ matrix.rid }}
      - name: Package
        run: |
          cd out/${{ matrix.rid }}
          rm -f *.pdb
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -q ../../tfsed-${{ matrix.rid }}.zip *
          else
            chmod +x tfsed
            tar -czf ../../tfsed-${{ matrix.rid }}.tar.gz *
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tfsed-${{ matrix.rid }}
          path: tfsed-${{ matrix.rid }}.*

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
